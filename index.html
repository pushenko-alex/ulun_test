<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ананасовый улун | Teaboom</title>
</head>
<body>
  <main class="product-page">
    <section class="product-card">
      <div class="product-card__media">
        <img src="/src/assets/tea.jpg" alt="Ананасовый улун">
      </div>

      <div class="product-card__content">
        <a class="product-card__category" href="#">Улун</a>
        <h1 class="product-card__title">Ананасовый улун</h1>

        <div class="product-card__packs" id="packs"></div>

        <div class="product-card__info">
          <div class="product-card__row">
            <span>Артикул</span>
            <strong id="article"></strong>
          </div>

          <div class="product-card__row">
            <span>Цена</span>
            <div>
              <strong id="price"></strong>
              <del id="old-price"></del>
            </div>
          </div>
        </div>

        <button class="product-card__button">
          В корзину
        </button>

        <article class="product-card__description">
          <h2>Описание</h2>
          <p>
            Нежный китайский улун с натуральным ароматом ананаса.
            Обладает мягким вкусом, фруктовым послевкусием и лёгкой сладостью.
          </p>
        </article>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
